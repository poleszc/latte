[package]
name = "latte"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "latc_llvm"
path = "src/bin/latc_llvm.rs"
test = false

[build-dependencies]
lalrpop = "0.22.2"

[dependencies]
ustr = "1.0"
clap = { version = "4.5.41", features = ["derive"] }
lalrpop-util = { version = "0.22.2", features = ["lexer", "unicode"] }
ariadne = {version = "0.4.0", features = ["auto-color"]}
logos = "0.14"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"